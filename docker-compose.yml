services:
  postgres:
    image: postgres:16-alpine
    container_name: assistiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistiq_user
      POSTGRES_PASSWORD: assistiq_dev_password
      POSTGRES_DB: assistiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistiq_user -d assistiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
